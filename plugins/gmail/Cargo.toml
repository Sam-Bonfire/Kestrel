[package]
name = "gmail"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.36.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# reqwest needs specific features for WASI, or we might need standard HTTP.
# We will use simple HTTP clients if reqwest doesn't compile to wasm32-wasi without issues.
tokio = { version = "1", features = ["macros", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
