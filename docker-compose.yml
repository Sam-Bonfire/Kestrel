version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kestrel-backend:latest
    container_name: kestrel-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - kestrel-data:/app/data
      - kestrel-plugins:/app/plugins
    environment:
      # Database Config (supports SQLite file path or PostgreSQL connection strings)
      - DATABASE_URL=${DATABASE_URL:-sqlite:/app/data/kestrel.db}
      
      # Server config
      - PORT=${PORT:-8080}
      - HOST=${HOST:-0.0.0.0} # Can be set to a Tailscale IP to restrict access
      - RUST_LOG=${RUST_LOG:-info,kestrel=debug}
      - SESSION_SECRET=${SESSION_SECRET} # Secure key for session cookies
      - PLUGINS_DIR=${PLUGINS_DIR:-/app/plugins}
      
      # OAuth Provider Credentials
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      
      # Canonical base URL for oauth redirects and API calls
      - KESTREL_BASE_URL=${KESTREL_BASE_URL}
      
      # Background Sync Configurations
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-5}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kestrel-data:
    driver: local
  kestrel-plugins:
    driver: local
