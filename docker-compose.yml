version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kestrel-backend:latest
    container_name: kestrel-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - kestrel-data:/app/data
      - kestrel-plugins:/app/plugins
    environment:
      # Database Config (supports SQLite file path or PostgreSQL connection strings)
      - DATABASE_URL=${DATABASE_URL:-sqlite:/app/data/kestrel.db}
      
      # Server config
      - PORT=${PORT:-8080}
      - HOST=${HOST:-0.0.0.0} # Can be set to a Tailscale IP to restrict access
      - RUST_LOG=${RUST_LOG:-info,kestrel=debug}
      - SESSION_SECRET=${SESSION_SECRET} # Secure key for session cookies
      - PLUGINS_DIR=${PLUGINS_DIR:-/app/plugins}
      
      # Secrets Manager Spec (Optional secretspec integration)
      - SECRETSPEC_PATH=${SECRETSPEC_PATH}
      
      # OAuth Provider Scopes & Credentials (Fallback if SECRETSPEC_PATH is empty)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      
      # Background Sync Configurations
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-5}
      
      # Push Notification Integrations (Fallback if SECRETSPEC_PATH is empty)
      - FCM_API_KEY=${FCM_API_KEY}

volumes:
  kestrel-data:
    driver: local
  kestrel-plugins:
    driver: local
