name: Production Phase (Release Deployment)

on:
  workflow_run:
    workflows: ["Tag Release"]
    types: [completed]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g., v1.1.0)'
        required: false

concurrency:
  group: production-${{ github.event.inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  production:
    name: Production
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: backend
            os: ubuntu-latest
            name: Backend Linux Binary
          - task: docker
            os: ubuntu-latest
            name: Publish GHCR Container Image
          - task: desktop-windows
            os: windows-latest
            name: Desktop Windows (MSI/EXE)
          - task: desktop-linux
            os: ubuntu-latest
            name: Desktop Linux (deb/AppImage)
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Install Linux dependencies
        if: matrix.task == 'desktop-linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        if: matrix.task != 'docker'
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Build Backend
        if: matrix.task == 'backend'
        run: mise run build:backend
      
      - name: Upload Backend Artifact
        if: matrix.task == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: release-backend-linux-x86_64
          path: backend/target/release/backend
          retention-days: 7

      - name: Setup Desktop Build
        if: matrix.task == 'desktop-windows' || matrix.task == 'desktop-linux'
        run: mise run setup

      - name: Build Desktop Apps
        if: matrix.task == 'desktop-windows' || matrix.task == 'desktop-linux'
        run: |
          mise run build:frontend-mail
          mise run build:frontend-calendar

      - name: Upload Windows MSI
        if: matrix.task == 'desktop-windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-packages
          path: |
            frontend-mail/src-tauri/target/release/bundle/msi/*.msi
            frontend-calendar/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

      - name: Upload Linux DEB
        if: matrix.task == 'desktop-linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-packages
          path: |
            frontend-mail/src-tauri/target/release/bundle/deb/*.deb
            frontend-calendar/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7

      - name: Setup Docker Buildx
        if: matrix.task == 'docker'
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GHCR
        if: matrix.task == 'docker'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Lowercase repository owner
        if: matrix.task == 'docker'
        id: repo_owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
        
      - name: Determine Docker Tag
        if: matrix.task == 'docker'
        id: docker_tag
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          
      - name: Build and push production image
        if: matrix.task == 'docker'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:${{ steps.docker_tag.outputs.TAG }}
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v3
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish GitHub Release
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          gh release create "$TAG" --title "Release $TAG" --notes-file RELEASE_NOTES.md release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
