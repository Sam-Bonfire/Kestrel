name: Production Phase (Release Deployment)

on:
  workflow_run:
    workflows: ["Tag Release"]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g., v1.1.0)'
        required: false

concurrency:
  group: production-${{ github.event.inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}


      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true


      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-rust-shared-cache"
          save-if: false
      - name: Run Backend Checks
        run: |
          mise run setup
          mise run check:backend

      - name: Build release binary for Docker validation
        run: mise run build:backend

      - name: Verify Dockerfile Build
        run: docker build -f backend/Dockerfile.ci .

  validate-mail:
    name: Validate Mail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}


      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true


      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-rust-shared-cache"
          save-if: false
      - name: Run Mail Checks
        run: |
          mise run setup
          mise run check:frontend-mail

  validate-calendar:
    name: Validate Calendar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}


      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true


      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-rust-shared-cache"
          save-if: false
      - name: Run Calendar Checks
        run: |
          mise run setup
          mise run check:frontend-calendar

  build-backend:
    name: Build Backend (Linux)
    needs: [validate-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}


      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true


      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-rust-shared-cache"
          save-if: false
      - name: Build Backend
        run: mise run build:backend
      
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-backend-linux-x86_64
          path: target/release/backend
          retention-days: 7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Lowercase repository owner
        id: repo_owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")" >> $GITHUB_OUTPUT
        
      - name: Determine Docker Tag
        id: docker_tag
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          
      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:${{ steps.docker_tag.outputs.TAG }}
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:latest

  build-mail:
    name: Build Mail (${{ matrix.os }})
    needs: [validate-mail]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}


      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true


      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-rust-shared-cache"
          save-if: false
      - name: Setup Desktop Build
        run: mise run setup

      - name: Build Mail Desktop App
        run: mise run build:frontend-mail

      - name: Upload Windows MSI & EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-mail-windows-packages
          path: |
            target/release/bundle/msi/*Mail*.msi
            target/release/bundle/nsis/*Mail*.exe
          retention-days: 7

      - name: Upload Linux Packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-mail-linux-packages
          path: |
            target/release/bundle/deb/*mail*.deb
            target/release/bundle/rpm/*mail*.rpm
            target/release/bundle/appimage/*Mail*.AppImage
          retention-days: 7

  build-mail-android:
    name: Build Mail (Android)
    needs: [validate-mail]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          
      - name: Setup Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-rust-android-cache"
          save-if: false

      - name: Setup Build
        run: mise run setup

      - name: Initialize Tauri Android
        run: cd frontend-mail && pnpm tauri android init

      - name: Build Mail Android App
        run: mise run build:frontend-mail:android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-mail-android-apk
          path: |
            frontend-mail/src-tauri/gen/android/**/release/*.apk
            frontend-mail/src-tauri/gen/android/**/release/*.aab
          retention-days: 7

  build-calendar:
    name: Build Calendar (${{ matrix.os }})
    needs: [validate-calendar]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}


      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true


      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-rust-shared-cache"
          save-if: false
      - name: Setup Desktop Build
        run: mise run setup

      - name: Build Calendar Desktop App
        run: mise run build:frontend-calendar

      - name: Upload Windows MSI & EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-calendar-windows-packages
          path: |
            target/release/bundle/msi/*Calendar*.msi
            target/release/bundle/nsis/*Calendar*.exe
          retention-days: 7

      - name: Upload Linux Packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-calendar-linux-packages
          path: |
            target/release/bundle/deb/*calendar*.deb
            target/release/bundle/rpm/*calendar*.rpm
            target/release/bundle/appimage/*Calendar*.AppImage
          retention-days: 7

  build-calendar-android:
    name: Build Calendar (Android)
    needs: [validate-calendar]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          
      - name: Setup Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-rust-android-cache"
          save-if: false

      - name: Setup Build
        run: mise run setup

      - name: Initialize Tauri Android
        run: cd frontend-calendar && pnpm tauri android init

      - name: Build Calendar Android App
        run: mise run build:frontend-calendar:android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-calendar-android-apk
          path: |
            frontend-calendar/src-tauri/gen/android/**/release/*.apk
            frontend-calendar/src-tauri/gen/android/**/release/*.aab
          retention-days: 7

  create-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-backend, build-mail, build-mail-android, build-calendar, build-calendar-android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish GitHub Release
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          gh release create "$TAG" --title "Release $TAG" --notes-file RELEASE_NOTES.md release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
