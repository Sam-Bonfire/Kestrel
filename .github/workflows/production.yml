name: Production Phase (Release Deployment)

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- All platform release builds execute concurrently in parallel ---

  backend-prod-build:
    name: Backend Linux Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - run: cargo build --release --manifest-path backend/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: release-backend-linux-x86_64
          path: backend/target/release/backend
          retention-days: 90

  docker-prod-publish:
    name: Publish GHCR Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repository owner
        id: repo_owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:${{ github.ref_name }}
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-windows:
    name: Desktop Windows (MSI/EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend-mail/src-tauri -> target
            frontend-calendar/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kestrel/shared build
      - run: pnpm --filter frontend-mail tauri build
      - run: pnpm --filter frontend-calendar tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-packages
          path: |
            frontend-mail/src-tauri/target/release/bundle/msi/*.msi
            frontend-calendar/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 90

  build-linux:
    name: Desktop Linux (deb/AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend-mail/src-tauri -> target
            frontend-calendar/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kestrel/shared build
      - run: pnpm --filter frontend-mail tauri build
      - run: pnpm --filter frontend-calendar tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-packages
          path: |
            frontend-mail/src-tauri/target/release/bundle/deb/*.deb
            frontend-calendar/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 90

  # --- Release Creation Step waits for all parallel jobs to complete ---

  create-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [backend-prod-build, docker-prod-publish, build-windows, build-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
