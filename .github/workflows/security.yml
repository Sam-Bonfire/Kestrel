name: Daily Security

# Security runs on main-PRs, every merge to dev/main, and weekly. dev-PRs
# skip it: the same gates run post-merge on push to dev, and PR validation
# (preview.yml) covers the pre-merge loop there.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
      - main
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  rust-advisories:
    name: Cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Unfixable upstream; rationale + re-check dates live in
          # .cargo/audit.toml (mirrored here — this action only honors its
          # `ignore` input, not the project config file).
          ignore: RUSTSEC-2026-0367,RUSTSEC-2026-0368,RUSTSEC-2026-0369,RUSTSEC-2026-0391,RUSTSEC-2026-0398,RUSTSEC-2026-0403,RUSTSEC-2026-0410

  js-advisories:
    name: pnpm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm audit --audit-level=high
      - run: pnpm --recursive audit --audit-level=high

  leaked-secrets:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.9
        with:
          extra_args: --only-verified
