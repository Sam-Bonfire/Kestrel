name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      tag: ${{ steps.read_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: read_version
        run: |
          VERSION=$(jq -r '.version' frontend-mail/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check version consistency
        run: |
          V_MAIL_TAURI=$(jq -r '.version' frontend-mail/src-tauri/tauri.conf.json)
          V_CAL_TAURI=$(jq -r '.version' frontend-calendar/src-tauri/tauri.conf.json)
          V_MAIL_CARGO=$(grep '^version' frontend-mail/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          V_CAL_CARGO=$(grep '^version' frontend-calendar/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          V_BACKEND=$(grep '^version' backend/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          
          echo "Mail Tauri: $V_MAIL_TAURI"
          echo "Calendar Tauri: $V_CAL_TAURI"
          echo "Mail Cargo: $V_MAIL_CARGO"
          echo "Calendar Cargo: $V_CAL_CARGO"
          echo "Backend Cargo: $V_BACKEND"
          
          if [ "$V_MAIL_TAURI" != "$V_CAL_TAURI" ] || [ "$V_MAIL_TAURI" != "$V_MAIL_CARGO" ] || [ "$V_MAIL_TAURI" != "$V_CAL_CARGO" ] || [ "$V_MAIL_TAURI" != "$V_BACKEND" ]; then
            echo "ERROR: Version mismatch detected! All versions must be identical."
            exit 1
          fi

      - name: Check tag doesn't already exist
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.read_version.outputs.version }}"; then
            echo "ERROR: Tag v${{ steps.read_version.outputs.version }} already exists!"
            exit 1
          fi

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Build release binary
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-backend-linux
          path: backend/target/release/backend
          retention-days: 90

  backend-docker:
    name: Backend Docker
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kestrel-backend:${{ needs.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/kestrel-backend:latest

  build-windows:
    name: Desktop Windows
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend-mail/src-tauri -> target
            frontend-calendar/src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared library
        run: pnpm --filter @kestrel/shared build

      - name: Build Tauri Mail
        run: pnpm --filter frontend-mail tauri build

      - name: Build Tauri Calendar
        run: pnpm --filter frontend-calendar tauri build

      - name: Upload Mail MSI
        uses: actions/upload-artifact@v4
        with:
          name: release-mail-windows-msi
          path: frontend-mail/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 90

      - name: Upload Calendar MSI
        uses: actions/upload-artifact@v4
        with:
          name: release-calendar-windows-msi
          path: frontend-calendar/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 90

      - name: Upload Mail EXE
        uses: actions/upload-artifact@v4
        with:
          name: release-mail-windows-exe
          path: frontend-mail/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Calendar EXE
        uses: actions/upload-artifact@v4
        with:
          name: release-calendar-windows-exe
          path: frontend-calendar/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 90
          if-no-files-found: warn

  build-linux:
    name: Desktop Linux
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend-mail/src-tauri -> target
            frontend-calendar/src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared library
        run: pnpm --filter @kestrel/shared build

      - name: Build Tauri Mail
        run: pnpm --filter frontend-mail tauri build

      - name: Build Tauri Calendar
        run: pnpm --filter frontend-calendar tauri build

      - name: Upload Mail deb
        uses: actions/upload-artifact@v4
        with:
          name: release-mail-linux-deb
          path: frontend-mail/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 90

      - name: Upload Calendar deb
        uses: actions/upload-artifact@v4
        with:
          name: release-calendar-linux-deb
          path: frontend-calendar/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 90

      - name: Upload Mail AppImage
        uses: actions/upload-artifact@v4
        with:
          name: release-mail-linux-appimage
          path: frontend-mail/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 90

      - name: Upload Calendar AppImage
        uses: actions/upload-artifact@v4
        with:
          name: release-calendar-linux-appimage
          path: frontend-calendar/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 90

  build-macos:
    name: Desktop macOS
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend-mail/src-tauri -> target
            frontend-calendar/src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared library
        run: pnpm --filter @kestrel/shared build

      - name: Build Tauri Mail
        run: pnpm --filter frontend-mail tauri build --target universal-apple-darwin

      - name: Build Tauri Calendar
        run: pnpm --filter frontend-calendar tauri build --target universal-apple-darwin

      - name: Upload Mail dmg
        uses: actions/upload-artifact@v4
        with:
          name: release-mail-macos-dmg
          path: frontend-mail/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 90

      - name: Upload Calendar dmg
        uses: actions/upload-artifact@v4
        with:
          name: release-calendar-macos-dmg
          path: frontend-calendar/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 90

  mobile-android:
    name: Mobile Android
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28
        run: sdkmanager "ndk;28.0.12674087"

      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend-mail/src-tauri -> target
            frontend-calendar/src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared library
        run: pnpm --filter @kestrel/shared build

      - name: Init & Build Mail (Android)
        run: |
          cd frontend-mail
          pnpm tauri android init
          pnpm tauri android build --target aarch64
          pnpm tauri android build --target x86_64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.12674087

      - name: Init & Build Calendar (Android)
        run: |
          cd frontend-calendar
          pnpm tauri android init
          pnpm tauri android build --target aarch64
          pnpm tauri android build --target x86_64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.12674087

      - name: Upload Mail APK
        uses: actions/upload-artifact@v4
        with:
          name: release-mail-android-apk
          path: frontend-mail/src-tauri/gen/android/**/outputs/**/*.apk
          retention-days: 90

      - name: Upload Calendar APK
        uses: actions/upload-artifact@v4
        with:
          name: release-calendar-android-apk
          path: frontend-calendar/src-tauri/gen/android/**/outputs/**/*.apk
          retention-days: 90

  mobile-ios:
    name: Mobile iOS
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend-mail/src-tauri -> target
            frontend-calendar/src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared library
        run: pnpm --filter @kestrel/shared build

      - name: Init & Build Mail (iOS)
        run: |
          cd frontend-mail
          pnpm tauri ios init
          pnpm tauri ios build --target aarch64-apple-ios-sim

      - name: Init & Build Calendar (iOS)
        run: |
          cd frontend-calendar
          pnpm tauri ios init
          pnpm tauri ios build --target aarch64-apple-ios-sim

      - name: Upload Mail iOS build
        uses: actions/upload-artifact@v4
        with:
          name: release-mail-ios
          path: frontend-mail/src-tauri/gen/apple/build/**/*.app
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Calendar iOS build
        uses: actions/upload-artifact@v4
        with:
          name: release-calendar-ios
          path: frontend-calendar/src-tauri/gen/apple/build/**/*.app
          retention-days: 90
          if-no-files-found: warn

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, backend-build, backend-docker, build-windows, build-linux, build-macos, mobile-android, mobile-ios]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Display structure
        run: find release-artifacts -type f | head -80

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Kestrel ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
