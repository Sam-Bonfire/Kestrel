name: Main Branch Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mail: ${{ steps.filter.outputs.mail }}
      calendar: ${{ steps.filter.outputs.calendar }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - 'mise.toml'
            mail:
              - 'frontend-mail/**'
              - 'frontend-shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - 'mise.toml'
            calendar:
              - 'frontend-calendar/**'
              - 'frontend-shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - 'mise.toml'

  validate-backend:
    name: Validate Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true


      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-rust-shared-cache"
          save-if: false
      - name: Run Backend Checks
        run: |
          mise run setup
          mise run check:backend

      - name: Build release binary for Docker validation
        run: mise run build:backend

      - name: Verify Dockerfile Build
        run: docker build -f backend/Dockerfile.ci .

  validate-mail:
    name: Validate Mail
    needs: changes
    if: needs.changes.outputs.mail == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true


      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-rust-shared-cache"
          save-if: false
      - name: Run Mail Checks
        run: |
          mise run setup
          mise run check:frontend-mail

  validate-calendar:
    name: Validate Calendar
    needs: changes
    if: needs.changes.outputs.calendar == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true


      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-rust-shared-cache"
          save-if: false
      - name: Run Calendar Checks
        run: |
          mise run setup
          mise run check:frontend-calendar
