name: Preview Phase (PR Validation)

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:

    strategy:
      fail-fast: false
      matrix:
        include:
          - task: backend
            os: ubuntu-latest
            name: Backend Validation & Unit Tests
          - task: frontend
            os: ubuntu-latest
            name: Frontend Monorepo Validation
          - task: desktop-windows
            os: windows-latest
            name: Desktop Windows Build
          - task: desktop-linux
            os: ubuntu-latest
            name: Desktop Linux Build
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.task == 'desktop-linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Check & Build Backend
        if: matrix.task == 'backend'
        run: |
          mise run check
          mise run build:backend

      - name: Upload Backend Artifact
        if: matrix.task == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: preview-backend-linux
          path: backend/target/release/backend
          retention-days: 3

      - name: Setup & Build Frontend Web
        if: matrix.task == 'frontend'
        run: |
          mise run setup
          pnpm --filter frontend-mail build
          pnpm --filter frontend-calendar build

      - name: Setup Desktop Build
        if: matrix.task == 'desktop-windows' || matrix.task == 'desktop-linux'
        run: mise run setup

      - name: Build Desktop Apps
        if: matrix.task == 'desktop-windows' || matrix.task == 'desktop-linux'
        run: |
          mise run build:frontend-mail
          mise run build:frontend-calendar

      - name: Upload Windows MSI
        if: matrix.task == 'desktop-windows'
        uses: actions/upload-artifact@v4
        with:
          name: preview-windows-msi
          path: |
            frontend-mail/src-tauri/target/release/bundle/msi/*.msi
            frontend-calendar/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 3

      - name: Upload Linux DEB
        if: matrix.task == 'desktop-linux'
        uses: actions/upload-artifact@v4
        with:
          name: preview-linux-deb
          path: |
            frontend-mail/src-tauri/target/release/bundle/deb/*.deb
            frontend-calendar/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 3
