name: Preview Phase (PR Validation)

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- All independent jobs run in parallel for maximum speed ---

  backend-check:
    name: Backend Validation & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Cargo fmt
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Cargo clippy
        run: cargo clippy --manifest-path backend/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Cargo build
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-backend-linux
          path: backend/target/release/backend
          retention-days: 7

  frontend-check:
    name: Frontend Monorepo Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared library
        run: pnpm --filter @kestrel/shared build

      - name: Build Mail app
        run: pnpm --filter frontend-mail build

      - name: Build Calendar app
        run: pnpm --filter frontend-calendar build

  desktop-windows:
    name: Desktop Windows Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend-mail/src-tauri -> target
            frontend-calendar/src-tauri -> target

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @kestrel/shared build

      - name: Build Mail MSI
        run: pnpm --filter frontend-mail tauri build

      - name: Build Calendar MSI
        run: pnpm --filter frontend-calendar tauri build

      - name: Upload Windows MSI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-windows-msi
          path: |
            frontend-mail/src-tauri/target/release/bundle/msi/*.msi
            frontend-calendar/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

  desktop-linux:
    name: Desktop Linux Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend-mail/src-tauri -> target
            frontend-calendar/src-tauri -> target

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @kestrel/shared build

      - name: Build Mail deb
        run: pnpm --filter frontend-mail tauri build

      - name: Build Calendar deb
        run: pnpm --filter frontend-calendar tauri build

      - name: Upload Linux deb Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-linux-deb
          path: |
            frontend-mail/src-tauri/target/release/bundle/deb/*.deb
            frontend-calendar/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
