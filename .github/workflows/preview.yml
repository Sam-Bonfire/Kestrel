name: Preview Phase (PR Validation)

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Validation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Backend & Web Validation
        if: matrix.os == 'ubuntu-latest'
        run: |
          mise run check
          mise run build:backend
          mise run setup
          pnpm --filter frontend-mail build
          pnpm --filter frontend-calendar build

      - name: Desktop Build Setup
        run: mise run setup

      - name: Build Desktop Apps
        run: |
          mise run build:frontend-mail
          mise run build:frontend-calendar

      - name: Upload Windows MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: preview-windows-msi
          path: |
            frontend-mail/src-tauri/target/release/bundle/msi/*.msi
            frontend-calendar/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 3

      - name: Upload Linux DEB
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: preview-linux-deb
          path: |
            frontend-mail/src-tauri/target/release/bundle/deb/*.deb
            frontend-calendar/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 3
