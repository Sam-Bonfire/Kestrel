name: Preview Phase (PR Validation)

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mail: ${{ steps.filter.outputs.mail }}
      calendar: ${{ steps.filter.outputs.calendar }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - 'mise.toml'
            mail:
              - 'frontend-mail/**'
              - 'frontend-shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - 'mise.toml'
            calendar:
              - 'frontend-calendar/**'
              - 'frontend-shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - 'mise.toml'
            landing:
              - 'frontend-landing/**'
              - 'frontend-shared/**'
              - 'backend/src/api/landing.rs'
              - 'backend/src/api/router.rs'
              - 'backend/src/api/mod.rs'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - 'mise.toml'

  validate-backend:
    name: Validate Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-backend-

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run Backend Checks
        id: backend_checks
        run: |
          mise run setup
          cargo fmt --manifest-path backend/Cargo.toml -- --check
          cargo clippy --manifest-path backend/Cargo.toml -- -D warnings
          set -o pipefail
          cargo test --manifest-path backend/Cargo.toml 2>&1 | tee backend/test-results.log

      - name: Reject ignored tests
        id: ignored_tests
        run: |
          matches=$(grep -rn --include='*.rs' '#\[ignore' backend plugins || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::#[ignore] disables a test silently; fix or delete it instead"
            exit 1
          fi

      - name: Run Shared Contract Tests
        id: shared_tests
        run: |
          pnpm --filter @kestrel/shared build
          pnpm --filter @kestrel/shared exec vitest run --reporter=json --outputFile=test-results.json

      - name: Build release binary for Docker validation
        id: build_backend
        run: mise run build:backend

      - name: Verify Dockerfile Build
        id: docker_build
        run: docker build -f backend/Dockerfile.ci .

      - name: Generate Granular Test Summary
        if: always()
        run: node scripts/generate-test-summary.mjs

  validate-mail:
    name: Validate Mail
    needs: changes
    if: needs.changes.outputs.mail == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-mail-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-mail-linux-

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run Mail Checks
        id: mail_checks
        run: |
          mise run setup
          mise run check:frontend-mail

      - name: Generate Mail Summary
        if: always()
        run: |
          echo "### ✉️ Kestrel Mail Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Target | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Mail Linters, Clippy & Build | \`frontend-mail/\` | ${{ steps.mail_checks.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | ${{ steps.mail_checks.outcome }} |" >> $GITHUB_STEP_SUMMARY

  validate-calendar:
    name: Validate Calendar
    needs: changes
    if: needs.changes.outputs.calendar == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-calendar-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-calendar-linux-

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run Calendar Checks
        id: calendar_checks
        run: |
          mise run setup
          mise run check:frontend-calendar

      - name: Generate Calendar Summary
        if: always()
        run: |
          echo "### 📅 Kestrel Calendar Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Target | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Calendar Linters, Clippy & Build | \`frontend-calendar/\` | ${{ steps.calendar_checks.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | ${{ steps.calendar_checks.outcome }} |" >> $GITHUB_STEP_SUMMARY

  validate-landing:
    name: Validate Landing
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run Landing Checks
        id: landing_checks
        run: |
          mise run setup
          mise run check:landing

      - name: Generate Landing Summary
        if: always()
        run: |
          echo "### Kestrel Landing Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Target | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Landing Build | \`frontend-landing/\` | ${{ steps.landing_checks.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | ${{ steps.landing_checks.outcome }} |" >> $GITHUB_STEP_SUMMARY


  e2e-backend:
    name: E2E Backend (${{ matrix.db }})
    needs: [validate-backend, validate-mail, validate-calendar]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kestrel
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kestrel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-backend-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Build plugins
        run: mise run build:plugins

      - name: Set DB URL for Postgres
        if: matrix.db == 'postgres'
        run: echo "DATABASE_URL=postgres://kestrel:password@localhost:5432/kestrel" >> $GITHUB_ENV

      - name: Set DB URL for SQLite
        if: matrix.db == 'sqlite'
        run: echo "DATABASE_URL=sqlite:./data/kestrel.db" >> $GITHUB_ENV

      - name: Run Backend & Tests
        env:
          KESTREL_SEED_PASSWORD: e2e-password-123
          JWT_SECRET: e2e-jwt-secret-12345678901234567890
          VAULT_SECRET: e2e-vault-secret-12345678901234567890
          PORT: 8080
          HOST: 0.0.0.0
        run: |
          mise run db:migrate
          SQLX_OFFLINE=true cargo run --bin seed

          # Start the backend in the background
          cargo run --bin kestrel-server > backend.log 2>&1 &
          SERVER_PID=$!

          # Wait for health endpoint
          echo "Waiting for backend to be healthy..."
          n=0
          until [ "$n" -ge 30 ]
          do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null; then
              echo "Backend is healthy!"
              break
            fi
            n=$((n+1))
            sleep 1
          done

          if [ "$n" -ge 30 ]; then
            echo "Backend failed to start in time. Logs:"
            cat backend.log
            kill $SERVER_PID || true
            exit_code=1
            false
          fi

          # Run Playwright E2E suite
          mise run test:e2e:install
          mise run test:e2e

          kill $SERVER_PID || true

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces-${{ matrix.db }}
          path: e2e/test-results/
          retention-days: 7

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-logs-${{ matrix.db }}
          path: backend.log
          retention-days: 7
