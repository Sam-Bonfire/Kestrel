name: Preview Phase (PR Validation)

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mail: ${{ steps.filter.outputs.mail }}
      calendar: ${{ steps.filter.outputs.calendar }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - 'mise.toml'
            mail:
              - 'frontend-mail/**'
              - 'frontend-shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - 'mise.toml'
            calendar:
              - 'frontend-calendar/**'
              - 'frontend-shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - 'mise.toml'

  validate-backend:
    name: Validate Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            frontend-mail/node_modules
            frontend-calendar/node_modules
            frontend-shared/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-backend-

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run Backend Checks
        id: backend_checks
        run: |
          mise run setup
          cargo fmt --manifest-path backend/Cargo.toml -- --check
          cargo clippy --manifest-path backend/Cargo.toml -- -D warnings
          cargo test --manifest-path backend/Cargo.toml 2>&1 | tee backend/test-results.log

      - name: Run Shared Contract Tests
        id: shared_tests
        run: |
          pnpm --filter @kestrel/shared build
          pnpm --filter @kestrel/shared exec vitest run --reporter=json --outputFile=test-results.json

      - name: Build release binary for Docker validation
        id: build_backend
        run: mise run build:backend

      - name: Verify Dockerfile Build
        id: docker_build
        run: docker build -f backend/Dockerfile.ci .

      - name: Generate Granular Test Summary
        if: always()
        run: node scripts/generate-test-summary.mjs

  validate-mail:
    name: Validate Mail
    needs: changes
    if: needs.changes.outputs.mail == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            frontend-mail/node_modules
            frontend-calendar/node_modules
            frontend-shared/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-mail-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-mail-linux-

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run Mail Checks
        id: mail_checks
        run: |
          mise run setup
          mise run check:frontend-mail

      - name: Generate Mail Summary
        if: always()
        run: |
          echo "### ✉️ Kestrel Mail Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Target | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Mail Linters, Clippy & Build | \`frontend-mail/\` | ${{ steps.mail_checks.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | ${{ steps.mail_checks.outcome }} |" >> $GITHUB_STEP_SUMMARY

  validate-calendar:
    name: Validate Calendar
    needs: changes
    if: needs.changes.outputs.calendar == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            frontend-mail/node_modules
            frontend-calendar/node_modules
            frontend-shared/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-calendar-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-calendar-linux-

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run Calendar Checks
        id: calendar_checks
        run: |
          mise run setup
          mise run check:frontend-calendar

      - name: Generate Calendar Summary
        if: always()
        run: |
          echo "### 📅 Kestrel Calendar Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Target | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Calendar Linters, Clippy & Build | \`frontend-calendar/\` | ${{ steps.calendar_checks.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | ${{ steps.calendar_checks.outcome }} |" >> $GITHUB_STEP_SUMMARY
