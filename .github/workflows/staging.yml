name: Staging Phase (Integration & Deployment)

on:
  push:
    branches:
      - dev

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  backend-staging-build:
    name: Backend Staging Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Cargo build release
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-backend-linux
          path: backend/target/release/backend
          retention-days: 14

  backend-docker-staging:
    name: Staging Docker Image GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: repo_owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:staging
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging-integration:
    name: Staging Deployment Verification
    runs-on: ubuntu-latest
    needs: backend-staging-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Staging Artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-backend-linux
          path: staging-artifact

      - name: Verify Staging Executable
        run: |
          chmod +x staging-artifact/backend
          DATABASE_URL=sqlite:./staging.db PORT=8080 HOST=0.0.0.0 RUST_LOG=info ./staging-artifact/backend &
          PID=$!
          sleep 5
          curl -f http://localhost:8080/api/v1/health
          kill $PID
