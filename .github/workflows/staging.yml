name: Staging Phase (Integration & Deployment)

on:
  push:
    branches:
      - dev

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  staging:
    name: Staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: backend
            os: ubuntu-latest
            name: Backend Staging
          - task: desktop-windows
            os: windows-latest
            name: Windows Staging
          - task: desktop-linux
            os: ubuntu-latest
            name: Linux Staging
          - task: docker
            os: ubuntu-latest
            name: Docker GHCR
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.task == 'desktop-linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        if: matrix.task != 'docker'
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cargo build release
        if: matrix.task == 'backend'
        run: mise run build:backend

      - name: Upload staging artifact
        if: matrix.task == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: staging-backend-linux
          path: backend/target/release/backend
          retention-days: 14

      - name: Setup Desktop Build
        if: matrix.task == 'desktop-windows' || matrix.task == 'desktop-linux'
        run: mise run setup

      - name: Build Desktop Apps
        if: matrix.task == 'desktop-windows' || matrix.task == 'desktop-linux'
        run: |
          mise run build:frontend-mail
          mise run build:frontend-calendar

      - name: Upload Windows MSI
        if: matrix.task == 'desktop-windows'
        uses: actions/upload-artifact@v4
        with:
          name: staging-windows-msi
          path: |
            frontend-mail/src-tauri/target/release/bundle/msi/*.msi
            frontend-calendar/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

      - name: Upload Linux DEB
        if: matrix.task == 'desktop-linux'
        uses: actions/upload-artifact@v4
        with:
          name: staging-linux-deb
          path: |
            frontend-mail/src-tauri/target/release/bundle/deb/*.deb
            frontend-calendar/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 14

      - name: Setup Docker Buildx
        if: matrix.task == 'docker'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: matrix.task == 'docker'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        if: matrix.task == 'docker'
        id: repo_owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push staging image
        if: matrix.task == 'docker'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:staging
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging-integration:
    name: Staging Deployment Verification
    runs-on: ubuntu-latest
    needs: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Staging Artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-backend-linux
          path: staging-artifact

      - name: Verify Staging Executable
        run: |
          chmod +x staging-artifact/backend
          DATABASE_URL=sqlite:./staging.db PORT=8080 HOST=0.0.0.0 RUST_LOG=info ./staging-artifact/backend &
          PID=$!
          sleep 5
          curl -f http://localhost:8080/api/v1/health
          kill $PID
