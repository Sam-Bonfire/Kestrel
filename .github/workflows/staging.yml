name: Staging Phase (Integration & Deployment)

on:
  push:
    branches:
      - dev

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-${{ github.job }}"
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run Backend Checks
        run: |
          mise run setup
          mise run check:backend

      - name: Build release binary for Docker validation
        run: mise run build:backend

      - name: Verify Dockerfile Build
        run: docker build -f backend/Dockerfile.ci .

  validate-mail:
    name: Validate Mail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-${{ github.job }}"
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run Mail Checks
        run: |
          mise run setup
          mise run check:frontend-mail

  validate-calendar:
    name: Validate Calendar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-${{ github.job }}"
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run Calendar Checks
        run: |
          mise run setup
          mise run check:frontend-calendar

  build-backend:
    name: Build Backend (Linux)
    needs: [validate-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-${{ github.job }}"
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cargo build release
        run: mise run build:backend

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-backend-linux
          path: target/release/backend
          retention-days: 14

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: repo_owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")" >> $GITHUB_OUTPUT

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:staging
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:dev-${{ github.sha }}

  build-mail:
    name: Build Mail (${{ matrix.os }})
    needs: [validate-mail]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-${{ github.job }}"
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Setup Desktop Build
        run: mise run setup

      - name: Build Mail Desktop App
        run: mise run build:frontend-mail

      - name: Upload Windows MSI & EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: staging-mail-windows-packages
          path: |
            target/release/bundle/msi/*Mail*.msi
            target/release/bundle/nsis/*Mail*.exe
          retention-days: 14

      - name: Upload Linux Packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: staging-mail-linux-packages
          path: |
            target/release/bundle/deb/*mail*.deb
            target/release/bundle/rpm/*mail*.rpm
            target/release/bundle/appimage/*Mail*.AppImage
          retention-days: 14

  build-mail-android:
    name: Build Mail (Android)
    needs: [validate-mail]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-${{ github.job }}"
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          
      - name: Setup Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Setup Build
        run: mise run setup

      - name: Initialize Tauri Android
        run: cd frontend-mail && pnpm tauri android init

      - name: Build Mail Android App
        run: mise run build:frontend-mail:android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-mail-android-apk
          path: |
            frontend-mail/src-tauri/gen/android/**/release/*.apk
            frontend-mail/src-tauri/gen/android/**/release/*.aab
          retention-days: 14

  build-calendar:
    name: Build Calendar (${{ matrix.os }})
    needs: [validate-calendar]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-${{ github.job }}"
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Setup Desktop Build
        run: mise run setup

      - name: Build Calendar Desktop App
        run: mise run build:frontend-calendar

      - name: Upload Windows MSI & EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: staging-calendar-windows-packages
          path: |
            target/release/bundle/msi/*Calendar*.msi
            target/release/bundle/nsis/*Calendar*.exe
          retention-days: 14

      - name: Upload Linux Packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: staging-calendar-linux-packages
          path: |
            target/release/bundle/deb/*calendar*.deb
            target/release/bundle/rpm/*calendar*.rpm
            target/release/bundle/appimage/*Calendar*.AppImage
          retention-days: 14

  build-calendar-android:
    name: Build Calendar (Android)
    needs: [validate-calendar]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kestrel-${{ github.job }}"
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          
      - name: Setup Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Setup Build
        run: mise run setup

      - name: Initialize Tauri Android
        run: cd frontend-calendar && pnpm tauri android init

      - name: Build Calendar Android App
        run: mise run build:frontend-calendar:android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-calendar-android-apk
          path: |
            frontend-calendar/src-tauri/gen/android/**/release/*.apk
            frontend-calendar/src-tauri/gen/android/**/release/*.aab
          retention-days: 14

  staging-integration:
    name: Staging Deployment Verification
    runs-on: ubuntu-latest
    needs: [build-backend, build-mail, build-mail-android, build-calendar, build-calendar-android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Staging Artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-backend-linux
          path: staging-artifact

      - name: Verify Staging Executable
        run: |
          chmod +x staging-artifact/backend
          DATABASE_URL=sqlite:./staging.db PORT=8080 HOST=0.0.0.0 RUST_LOG=info ./staging-artifact/backend &
          PID=$!
          sleep 5
          curl -f http://localhost:8080/api/v1/health
          kill $PID
