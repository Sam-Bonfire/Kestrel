name: Staging Phase (Integration & Deployment)

on:
  push:
    branches:
      - dev

concurrency:
  group: staging
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            frontend-mail/node_modules
            frontend-calendar/node_modules
            frontend-shared/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-backend-

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run Backend Checks
        id: backend_checks
        run: |
          mise run setup
          cargo fmt --manifest-path backend/Cargo.toml -- --check
          cargo clippy --manifest-path backend/Cargo.toml -- -D warnings
          cargo test --manifest-path backend/Cargo.toml 2>&1 | tee backend/test-results.log

      - name: Run Shared Contract Tests
        id: shared_tests
        run: |
          pnpm --filter @kestrel/shared build
          pnpm --filter @kestrel/shared exec vitest run --reporter=json --outputFile=test-results.json

      - name: Build release binary for Docker validation
        id: build_backend
        run: mise run build:backend

      - name: Verify Dockerfile Build
        id: docker_build
        run: docker build -f backend/Dockerfile.ci .

      - name: Generate Granular Test Summary
        if: always()
        run: node scripts/generate-test-summary.mjs

  validate-mail:
    name: Validate Mail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            frontend-mail/node_modules
            frontend-calendar/node_modules
            frontend-shared/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-mail-${{ matrix.os || 'linux' }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-mail-${{ matrix.os || 'linux' }}-

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run Mail Checks
        run: |
          mise run setup
          mise run check:frontend-mail

  validate-calendar:
    name: Validate Calendar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            frontend-mail/node_modules
            frontend-calendar/node_modules
            frontend-shared/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-calendar-${{ matrix.os || 'linux' }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-calendar-${{ matrix.os || 'linux' }}-

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run Calendar Checks
        run: |
          mise run setup
          mise run check:frontend-calendar

  build-backend:
    name: Build Backend (Linux)
    needs: [validate-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            frontend-mail/node_modules
            frontend-calendar/node_modules
            frontend-shared/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-backend-

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cargo build release
        run: mise run build:backend

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-backend-linux
          path: target/release/kestrel-server
          retention-days: 14

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: repo_owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")" >> $GITHUB_OUTPUT

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:staging
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/kestrel-backend:dev-${{ github.sha }}

  build-mail:
    name: Build Mail (${{ matrix.os }})
    needs: [validate-mail]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            frontend-mail/node_modules
            frontend-calendar/node_modules
            frontend-shared/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-mail-${{ matrix.os || 'linux' }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-mail-${{ matrix.os || 'linux' }}-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Setup Desktop Build
        run: mise run setup

      - name: Build Mail Desktop App
        run: mise run build:frontend-mail

      - name: Upload Windows MSI & EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: staging-mail-windows-packages
          path: |
            target/release/bundle/msi/*Mail*.msi
            target/release/bundle/nsis/*Mail*.exe
          retention-days: 14

      - name: Upload Linux Packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: staging-mail-linux-packages
          path: |
            target/release/bundle/deb/*mail*.deb
            target/release/bundle/rpm/*mail*.rpm
            target/release/bundle/appimage/*Mail*.AppImage
          retention-days: 14

  build-mail-android:
    name: Build Mail (Android)
    needs: [validate-mail]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Android Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-android-mail-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-android-mail-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          
      - name: Setup Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Setup Build
        run: mise run setup

      - name: Initialize Tauri Android
        run: cd frontend-mail && pnpm tauri android init

      - name: Build Mail Android App
        run: mise run build:frontend-mail:android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-mail-android-apk
          path: |
            frontend-mail/src-tauri/gen/android/**/release/*.apk
            frontend-mail/src-tauri/gen/android/**/release/*.aab
          retention-days: 14

  build-calendar:
    name: Build Calendar (${{ matrix.os }})
    needs: [validate-calendar]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache pnpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            frontend-mail/node_modules
            frontend-calendar/node_modules
            frontend-shared/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-calendar-${{ matrix.os || 'linux' }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-calendar-${{ matrix.os || 'linux' }}-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Setup Desktop Build
        run: mise run setup

      - name: Build Calendar Desktop App
        run: mise run build:frontend-calendar

      - name: Upload Windows MSI & EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: staging-calendar-windows-packages
          path: |
            target/release/bundle/msi/*Calendar*.msi
            target/release/bundle/nsis/*Calendar*.exe
          retention-days: 14

      - name: Upload Linux Packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: staging-calendar-linux-packages
          path: |
            target/release/bundle/deb/*calendar*.deb
            target/release/bundle/rpm/*calendar*.rpm
            target/release/bundle/appimage/*Calendar*.AppImage
          retention-days: 14

  build-calendar-android:
    name: Build Calendar (Android)
    needs: [validate-calendar]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache Android Cargo Target
        uses: actions/cache@v6
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-android-calendar-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-android-calendar-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          
      - name: Setup Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Setup Build
        run: mise run setup

      - name: Initialize Tauri Android
        run: cd frontend-calendar && pnpm tauri android init

      - name: Build Calendar Android App
        run: mise run build:frontend-calendar:android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-calendar-android-apk
          path: |
            frontend-calendar/src-tauri/gen/android/**/release/*.apk
            frontend-calendar/src-tauri/gen/android/**/release/*.aab
          retention-days: 14

  staging-integration:
    name: Staging Deployment Verification
    runs-on: ubuntu-latest
    needs: [build-backend, build-mail, build-mail-android, build-calendar, build-calendar-android]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Staging Artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-backend-linux
          path: staging-artifact

      - name: Verify Staging Executable
        run: |
          chmod +x staging-artifact/kestrel-server
          DATABASE_URL=sqlite:./staging.db PORT=8080 HOST=0.0.0.0 RUST_LOG=info ./staging-artifact/kestrel-server &
          PID=$!
          sleep 5
          curl -f http://localhost:8080/api/v1/health
          kill $PID

  promote-to-main:
    name: Promote to Main
    runs-on: ubuntu-latest
    needs: [staging-integration]
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fast-forward main to dev via GitHub API
        run: |
          curl -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/git/refs/heads/main \
            -d '{"sha":"${{ github.sha }}","force":false}'


