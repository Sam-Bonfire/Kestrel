name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend CI (Rust)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Check code formatting
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Clippy Linter
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

      - name: Run Backend Unit & Integration Tests
        run: cargo test --manifest-path backend/Cargo.toml

  frontend-ci:
    name: Frontend CI (Node & pnpm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared frontend library
        run: pnpm --filter @kestrel/shared build

      - name: Type check and build Mail App
        run: pnpm --filter frontend-mail build

      - name: Type check and build Calendar App
        run: pnpm --filter frontend-calendar build
