version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "UTC"
    groups:
      rust-patches:
        patterns: ["*"]
        update-types: ["patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "UTC"
    groups:
      npm-patches:
        patterns: ["*"]
        update-types: ["patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore"
    # Minor/major bumps stay manual: Tauri/Svelte upgrades need app testing.
    allow:
      - dependency-type: "all"
