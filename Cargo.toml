[workspace]
members = [
    "backend",
    "frontend-mail/src-tauri",
    "frontend-calendar/src-tauri"
, "plugins/gmail", "plugins/outlook"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# WASM plugins: size matters more than speed for module loading
[profile.release.package.gmail]
opt-level = "z"

[profile.release.package.outlook]
opt-level = "z"

