# Kestrel Tool & Task Configuration

[env]
RUSTUP_TOOLCHAIN = "stable"

[tools]
rust = "stable"
node = "22"
pnpm = "latest"
jujutsu = "latest"
"cargo:cargo-component" = "latest"

[tasks.init]
description = "First-time project setup (installs tools + all dependencies)"
run = [
    "echo \"==> Installing toolchain (Rust, Node, pnpm, jj)...\"",
    "mise install",
    "echo \"==> Running project setup...\"",
    "mise run setup"
]

[tasks.codegen]
description = "Export Specta v2 Rust types to frontend-shared TypeScript definitions"
dir = "backend"
run = "cargo run --bin export_types"

[tasks."dev:backend"]
description = "Start the Axum daemon in development mode"
dir = "backend"
run = 'cargo watch -x "run --bin kestrel-server"'

[tasks."dev:frontend-mail"]
description = "Start the Kestrel Mail Tauri dev server"
dir = "frontend-mail"
run = "pnpm tauri dev"

[tasks."dev:frontend-calendar"]
description = "Start the Kestrel Calendar Tauri dev server"
dir = "frontend-calendar"
run = "pnpm tauri dev"

[tasks."build:backend"]
description = "Build release binary for the backend"
dir = "backend"
depends = ["build:plugins"]
run = "cargo build --release"

[tasks."build:plugins"]
description = "Build all WASM plugins and copy them to the backend plugins directory"
run = [
    "rustup target add wasm32-wasip1",
    "echo \"==> Building gmail plugin...\"",
    "cargo component build --release --manifest-path plugins/gmail/Cargo.toml",
    "echo \"==> Building outlook plugin...\"",
    "cargo component build --release --manifest-path plugins/outlook/Cargo.toml",
    "echo \"==> Copying compiled WASM components to backend...\"",
    "node -e \"require('fs').mkdirSync('backend/plugins', { recursive: true })\"",
    "node -e \"require('fs').copyFileSync('target/wasm32-wasip1/release/gmail.wasm', 'backend/plugins/gmail.wasm')\"",
    "node -e \"require('fs').copyFileSync('target/wasm32-wasip1/release/outlook.wasm', 'backend/plugins/outlook.wasm')\"",
]

[tasks."build:frontend-mail"]
description = "Build Kestrel Mail native packages using Tauri"
dir = "frontend-mail"
run = "pnpm tauri build"

[tasks."build:frontend-mail:android"]
description = "Build Kestrel Mail Android APK/AAB using Tauri"
dir = "frontend-mail"
run = "pnpm tauri android build"

[tasks."build:frontend-calendar"]
description = "Build Kestrel Calendar native packages using Tauri"
dir = "frontend-calendar"
run = "pnpm tauri build"

[tasks."build:frontend-calendar:android"]
description = "Build Kestrel Calendar Android APK/AAB using Tauri"
dir = "frontend-calendar"
run = "pnpm tauri android build"

[tasks."test:backend"]
description = "Run backend cargo tests"
dir = "backend"
run = "cargo test"

[tasks."test:frontend"]
description = "Run frontend-shared Vitest unit and contract tests"
dir = "frontend-shared"
run = "pnpm test"

[tasks."test:hurl"]
description = "Execute intent-based Hurl API suites against live backend"
run = "hurl --variable base_url=http://localhost:8080 backend/tests/hurl/*.hurl"

[tasks.test]
description = "Run all automated tests (backend + frontend)"
depends = ["test:backend", "test:frontend"]
run = "echo \"==> All test suites passed!\""

[tasks."db:migrate"]
description = "Run SQLx migrations locally"
dir = "backend"
run = "cargo sqlx migrate run"

[tasks."dev"]
description = "Start all services (backend + mail + calendar) concurrently"
depends = ["dev:backend", "dev:frontend-mail", "dev:frontend-calendar"]

[tasks."dev:mail"]
description = "Start backend + Mail Tauri app"
depends = ["dev:backend", "dev:frontend-mail"]

[tasks."dev:calendar"]
description = "Start backend + Calendar Tauri app"
depends = ["dev:backend", "dev:frontend-calendar"]

[tasks.setup]
description = "Install all project dependencies (run once after mise install)"
run = [
    "echo \"==> Installing pnpm dependencies...\"",
    "pnpm install",
    "echo \"==> Building shared frontend library (@kestrel/shared)...\"",
    "pnpm --filter @kestrel/shared build",
    "echo \"==> Fetching Rust/Cargo dependencies...\"",
    "cargo fetch --manifest-path backend/Cargo.toml",
    "cargo fetch --manifest-path frontend-mail/src-tauri/Cargo.toml",
    "cargo fetch --manifest-path frontend-calendar/src-tauri/Cargo.toml",
    "echo \"==> Building WASM plugins...\"",
    "mise run build:plugins",
    "echo \"==> Setup complete!\""
]

[tasks."check:backend"]
description = "Run backend linters and tests"
run = [
    "echo \"==> Backend: fmt check...\"",
    "cargo fmt --manifest-path backend/Cargo.toml -- --check",
    "echo \"==> Backend: clippy...\"",
    "cargo clippy --manifest-path backend/Cargo.toml -- -D warnings",
    "echo \"==> Backend: tests...\"",
    "cargo test --manifest-path backend/Cargo.toml"
]

[tasks."check:frontend-mail"]
description = "Run Mail frontend linters and build"
run = [
    "echo \"==> Frontend Mail: fmt check...\"",
    "cargo fmt --manifest-path frontend-mail/src-tauri/Cargo.toml -- --check",
    "echo \"==> Frontend Mail: clippy...\"",
    "cargo clippy --manifest-path frontend-mail/src-tauri/Cargo.toml -- -D warnings",
    "echo \"==> Frontend Mail: build...\"",
    "pnpm --filter frontend-mail build"
]

[tasks."check:frontend-calendar"]
description = "Run Calendar frontend linters and build"
run = [
    "echo \"==> Frontend Calendar: fmt check...\"",
    "cargo fmt --manifest-path frontend-calendar/src-tauri/Cargo.toml -- --check",
    "echo \"==> Frontend Calendar: clippy...\"",
    "cargo clippy --manifest-path frontend-calendar/src-tauri/Cargo.toml -- -D warnings",
    "echo \"==> Frontend Calendar: build...\"",
    "pnpm --filter frontend-calendar build"
]

[tasks."check:frontend-shared"]
description = "Run Shared frontend tests and type checks"
run = [
    "echo \"==> Frontend Shared: type check...\"",
    "pnpm --filter @kestrel/shared build",
    "echo \"==> Frontend Shared: tests...\"",
    "pnpm --filter @kestrel/shared test"
]

[tasks.check]
description = "Run all linters, tests, and build checks"
depends = ["check:backend", "check:frontend-shared", "check:frontend-mail", "check:frontend-calendar"]
run = "echo \"==> All checks passed!\""

[tasks.clean]
description = "Remove all build artifacts and caches"
run = [
    "echo \"==> Cleaning Rust targets...\"",
    "cargo clean --manifest-path backend/Cargo.toml",
    "cargo clean --manifest-path frontend-mail/src-tauri/Cargo.toml",
    "cargo clean --manifest-path frontend-calendar/src-tauri/Cargo.toml",
    "echo \"==> Cleaning Node artifacts...\"",
    "rm -rf frontend-mail/.svelte-kit frontend-mail/build",
    "rm -rf frontend-calendar/.svelte-kit frontend-calendar/build",
    "rm -rf frontend-shared/dist",
    "echo \"==> Clean complete.\""
]

[tasks.sweep]
description = "Clean stale build artifacts older than 14 days to free disk space"
run = "cargo sweep --time 14"

