packages:
  - 'frontend-shared'
  - 'frontend-mail'
  - 'frontend-calendar'
  - 'frontend-landing'
  - 'e2e'
allowBuilds:
  esbuild: true
  svelte-preprocess: true
# Security overrides for transitive advisories (see K-1523).
# postcss 8.5.21 -> 8.5.28 pulls nanoid 3.3.18 (GHSA high: infinite loop).
# tinypool 1.1.1 (via vitest 3.2.7) has GHSA-5gmw-xhrv-c9v3 + GHSA-85c8-ppgw-ccpr (critical RCE); force >=2.1.2.
# dompurify <=3.4.16 (critical SAFE_FOR_TEMPLATES bypass), vite <=6.4.3, undici <8.12.2.
overrides:
  postcss: 8.5.28
  tinypool: 2.1.2
  dompurify: 3.4.17
  vite: 6.4.4
  undici: 8.12.2
