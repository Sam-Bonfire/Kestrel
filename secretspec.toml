# Declarative secret manifest: names and rules only, never values.
# Values live in a secret provider (decision: Vaultwarden via the `bw` provider).
# Config that is not secret (bind address, feature flags, URLs) stays in
# committed configuration, not here.
[project]
name = "kestrel"
revision = "1.0"

[profiles.default]
# Required for the server to start.
DATABASE_URL = { description = "Backend database connection string (contains credentials; use sqlite: FILE or postgres:// URL)", required = true }
JWT_SECRET = { description = "Signs auth JWTs", required = true }
SESSION_SECRET = { description = "Signs session cookies", required = true }
VAULT_SECRET = { description = "Encrypts provider tokens at rest (alias: KESTREL_VAULT_KEY)", required = true }

# Optional: needed only when a provider sync is configured.
VAULT_OLD_SECRET = { description = "Previous vault key kept during key rotation to decrypt tokens written with it (alias: KESTREL_VAULT_OLD_KEY)", required = false }
GMAIL_CLIENT_ID = { description = "Google OAuth client id for the Gmail provider", required = false }
GMAIL_CLIENT_SECRET = { description = "Google OAuth client secret for the Gmail provider", required = false }
OUTLOOK_CLIENT_ID = { description = "Microsoft OAuth client id for the Outlook provider", required = false }
OUTLOOK_CLIENT_SECRET = { description = "Microsoft OAuth client secret for the Outlook provider", required = false }
MICROSOFT_CLIENT_ID = { description = "Microsoft OAuth client id (alias used by Microsoft rounds of the token worker)", required = false }
MICROSOFT_CLIENT_SECRET = { description = "Microsoft OAuth client secret (alias)", required = false }
GOOGLE_CLIENT_ID = { description = "Google OAuth client id (alias)", required = false }
GOOGLE_CLIENT_SECRET = { description = "Google OAuth client secret (alias)", required = false }

KESTREL_SEED_PASSWORD = { description = "Password for the seeded bootstrap account in dev/seed runs", required = false }
