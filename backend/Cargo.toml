[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kestrel-server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization & Datetime
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Database layer
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "chrono", "uuid"] }

# Async traits
async-trait = "0.1"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"

# Auth
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"

# Async streams
futures = "0.3"
tokio-stream = "0.1"
wasmtime = "22.0.0"
wasmtime-wasi = "22.0.0"
reqwest = { version = "0.13.4", features = ["json", "form"] }
base64 = "0.23.0"
urlencoding = "2.1.3"
aes-gcm = "0.11.0"
sha2 = "0.11.0"
